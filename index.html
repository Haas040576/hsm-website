<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08121d">
<title>Haas &amp; Saida Media</title>
<style>
html,body{margin:0;min-height:100%;background:#08121d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#loader{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
<div id="loader">Website wird geladen …</div>
<script>
(async()=>{
  try{
    const files=['payload0.txt','payloadx1.txt','payloadx2.txt','payloadx3.txt','payloadx4.txt','payloadx5.txt','payloadx6.txt','payloadx7.txt'];
    const parts=await Promise.all(files.map(async file=>{
      const response=await fetch(file+'?v=1',{cache:'no-store'});
      if(!response.ok) throw new Error(file+' konnte nicht geladen werden');
      return response.text();
    }));
    const encoded=parts.join('');
    const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
    const html=pako.ungzip(bytes,{to:'string'});
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('loader').textContent='Website konnte nicht geladen werden. Bitte Seite neu laden.';
    console.error(error);
  }
})();
</script>
</body>
</html>
